[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-work-tracker"
version = "0.1.0"
description = "Read-only GitHub Issues and Projects weekly delivery summary adapter"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
github-weekly-summary = "github_work_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
