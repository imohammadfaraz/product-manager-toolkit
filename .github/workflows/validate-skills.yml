name: Validate Skills

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate Skill structure and catalog
        run: python scripts/validate_skills.py
      - name: Validate editorial evaluation fixtures
        run: python scripts/validate_skill_cases.py
