name: GitHub Work Tracker tests

on:
  pull_request:
    paths:
      - "integrations/delivery/github-issues-projects/**"
      - ".github/workflows/github-work-tracker.yml"
  push:
    branches: [main]
    paths:
      - "integrations/delivery/github-issues-projects/**"
      - ".github/workflows/github-work-tracker.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install adapter and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./integrations/delivery/github-issues-projects pytest
      - name: Run mocked tests
        run: pytest integrations/delivery/github-issues-projects/tests -q
